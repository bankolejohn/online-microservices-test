# ============================================================================
# PostgreSQL Credentials Secret
# ============================================================================
# In production, use Sealed Secrets or External Secrets Operator.
# These base64 values are for development only.
#
# Decode: echo "c2hvcHBpbmdfZGI=" | base64 -d → shopping_db
# Encode: echo -n "shopping_db" | base64
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    app: postgres
    app.kubernetes.io/part-of: online-shopping
    app.kubernetes.io/component: database
type: Opaque
data:
  # Database name: shopping_db
  POSTGRES_DB: c2hvcHBpbmdfZGI=
  # Username: shopping_user
  POSTGRES_USER: c2hvcHBpbmdfdXNlcg==
  # Password: shopping_secret_2026 (change in production!)
  POSTGRES_PASSWORD: c2hvcHBpbmdfc2VjcmV0XzIwMjY=
  # Full connection string (used by application services)
  # postgresql://shopping_user:shopping_secret_2026@postgres:5432/shopping_db
  DATABASE_URL: cG9zdGdyZXNxbDovL3Nob3BwaW5nX3VzZXI6c2hvcHBpbmdfc2VjcmV0XzIwMjZAcG9zdGdyZXM6NTQzMi9zaG9wcGluZ19kYg==
