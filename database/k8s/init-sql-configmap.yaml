# ============================================================================
# Database Schema — runs on first startup
# ============================================================================
# PostgreSQL will execute any .sql files in /docker-entrypoint-initdb.d/
# on the FIRST start (when the data directory is empty).
# Subsequent restarts skip this (data already exists).
#
# Tables:
#   - users: user accounts (user-authentication-service)
#   - products: product catalog (product-catalog-service)
#   - carts: shopping carts (cart-service)
#   - cart_items: items in carts (cart-service)
#   - orders: completed orders (checkout-service)
#   - payments: payment records (payment-service)
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  labels:
    app: postgres
    app.kubernetes.io/part-of: online-shopping
    app.kubernetes.io/component: database
data:
  init.sql: |
    -- ============================================================
    -- Online Shopping Database Schema
    -- ============================================================

    -- Users table (user-authentication-service)
    CREATE TABLE IF NOT EXISTS users (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        email VARCHAR(255) UNIQUE NOT NULL,
        password_hash VARCHAR(255) NOT NULL,
        name VARCHAR(255) NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );

    -- Products table (product-catalog-service)
    CREATE TABLE IF NOT EXISTS products (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        name VARCHAR(255) NOT NULL,
        description TEXT,
        price DECIMAL(10, 2) NOT NULL,
        image VARCHAR(500),
        category VARCHAR(100),
        stock_quantity INTEGER DEFAULT 0,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );

    -- Carts table (cart-service)
    CREATE TABLE IF NOT EXISTS carts (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id VARCHAR(255) NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );

    -- Cart items (cart-service)
    CREATE TABLE IF NOT EXISTS cart_items (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        cart_id UUID REFERENCES carts(id) ON DELETE CASCADE,
        product_id UUID NOT NULL,
        product_name VARCHAR(255),
        product_image VARCHAR(500),
        price DECIMAL(10, 2) NOT NULL,
        quantity INTEGER NOT NULL DEFAULT 1,
        added_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );

    -- Orders table (checkout-service)
    CREATE TABLE IF NOT EXISTS orders (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id VARCHAR(255) NOT NULL,
        status VARCHAR(50) DEFAULT 'pending',
        total_amount DECIMAL(10, 2) NOT NULL,
        shipping_address JSONB,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );

    -- Order items
    CREATE TABLE IF NOT EXISTS order_items (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        order_id UUID REFERENCES orders(id) ON DELETE CASCADE,
        product_id UUID NOT NULL,
        product_name VARCHAR(255),
        price DECIMAL(10, 2) NOT NULL,
        quantity INTEGER NOT NULL
    );

    -- Payments table (payment-service)
    CREATE TABLE IF NOT EXISTS payments (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        order_id UUID REFERENCES orders(id),
        amount DECIMAL(10, 2) NOT NULL,
        currency VARCHAR(3) DEFAULT 'USD',
        status VARCHAR(50) DEFAULT 'pending',
        payment_method VARCHAR(50),
        transaction_id VARCHAR(255),
        created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );

    -- Indexes for common queries
    CREATE INDEX IF NOT EXISTS idx_carts_user_id ON carts(user_id);
    CREATE INDEX IF NOT EXISTS idx_cart_items_cart_id ON cart_items(cart_id);
    CREATE INDEX IF NOT EXISTS idx_orders_user_id ON orders(user_id);
    CREATE INDEX IF NOT EXISTS idx_payments_order_id ON payments(order_id);
    CREATE INDEX IF NOT EXISTS idx_products_category ON products(category);

    -- Seed some products (for development)
    INSERT INTO products (name, description, price, image, category, stock_quantity) VALUES
        ('Wireless Headphones', 'Noise-cancelling Bluetooth headphones', 79.99, '/images/headphones.jpg', 'Electronics', 50),
        ('Running Shoes', 'Lightweight running shoes for daily training', 129.99, '/images/shoes.jpg', 'Sports', 30),
        ('Backpack', 'Water-resistant laptop backpack', 49.99, '/images/backpack.jpg', 'Accessories', 100),
        ('Smart Watch', 'Fitness tracking smartwatch', 199.99, '/images/watch.jpg', 'Electronics', 25),
        ('Coffee Maker', 'Programmable drip coffee maker', 59.99, '/images/coffee.jpg', 'Home', 40)
    ON CONFLICT DO NOTHING;
