# Shipping Service — values for the mono-chart
serviceName: shipping-service
environment: dev

image:
  repository: ""
  name: shipping-service
  tag: latest
  pullPolicy: Never

replicas: 2
containerPort: 8080
servicePort: 8080

serviceAccountName: shipping-sa
automountServiceAccountToken: false

health:
  enabled: true
  path: /health

env:
  - name: PORT
    value: "8080"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

pdb:
  enabled: true
  minAvailable: 1
