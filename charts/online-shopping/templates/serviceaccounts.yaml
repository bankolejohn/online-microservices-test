{{/*
============================================================================
ServiceAccounts — per-service identity (RBAC least-privilege)
============================================================================
Each service gets its own ServiceAccount. This ensures:
  - No service uses the default SA (which may have broad access)
  - RBAC can grant per-service permissions
  - Audit logs show which service performed which action
============================================================================
*/}}
{{- if .Values.rbac.create }}
{{- range $sa := .Values.rbac.serviceAccounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.name }}
  labels:
    {{- include "online-shopping.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $sa.component | default "backend" }}
{{- end }}
{{- end }}
