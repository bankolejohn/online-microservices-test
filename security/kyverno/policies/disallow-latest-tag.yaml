# ============================================================================
# Policy: Disallow Latest Tag
# ============================================================================
# WHY: The 'latest' tag is mutable — it can change without your knowledge.
#      If prod is running 'nginx:latest' and someone pushes a broken image
#      to that tag, your next pod restart pulls the broken version.
#      Pinned tags (sha-a1b2c3d, v1.2.3) are immutable and traceable.
#
# WHAT IT DOES: Rejects any pod that uses ':latest' or no tag at all.
#
# SCOPE: All namespaces except kube-system, kyverno, istio-system, argocd
#        (system components often use latest — that's the vendor's problem)
#
# REAL-WORLD IMPACT: Developers must use explicit tags in their Dockerfiles
#        and Kustomize overlays. CI pipeline produces SHA tags automatically.
# ============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      The ':latest' tag is mutable and not traceable. Require explicit
      image tags for all application containers.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - shopping
      validate:
        message: >-
          Using image tag ':latest' is not allowed. Use a specific version
          tag (e.g., ':v1.2.3' or ':sha-a1b2c3d'). Image '{{request.object.spec.containers[].image}}'
          violates this policy.
        pattern:
          spec:
            containers:
              - image: "!*:latest & *:*"
