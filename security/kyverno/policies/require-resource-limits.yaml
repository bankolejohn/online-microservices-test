# ============================================================================
# Policy: Require Resource Limits
# ============================================================================
# WHY: A container without resource limits can consume unbounded CPU and
#      memory, causing node instability. It can starve other pods, trigger
#      OOM kills on the node, and make capacity planning impossible.
#
# WHAT IT DOES: Rejects pods that don't specify both CPU and memory limits.
#
# NOTE: We already have LimitRange which sets DEFAULTS — but this policy
#       ensures developers explicitly think about resource requirements.
#       Explicit is better than implicit.
# ============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      All containers must specify resource limits (CPU and memory) to
      prevent resource starvation and enable proper capacity planning.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-resource-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - shopping
      # Exclude Istio init and sidecar containers (managed by Istio, not us)
      exclude:
        any:
          - resources:
              kinds:
                - Pod
              selector:
                matchLabels:
                  sidecar.istio.io/inject: "false"
      validate:
        message: >-
          All containers must have resource limits defined
          (spec.containers[].resources.limits.memory and
          spec.containers[].resources.limits.cpu).
        pattern:
          spec:
            containers:
              - resources:
                  limits:
                    memory: "?*"
                    cpu: "?*"
