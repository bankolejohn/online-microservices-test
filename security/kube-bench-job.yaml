# ============================================================================
# kube-bench Job — CIS Kubernetes Benchmark Scanner
# ============================================================================
# Runs the CIS benchmark against the control-plane node and outputs results.
# The Job runs once, produces a report, then the pod goes to Completed state.
#
# Usage:
#   kubectl apply -f security/kube-bench-job.yaml
#   kubectl wait --for=condition=complete job/kube-bench --timeout=120s
#   kubectl logs job/kube-bench
#
# What it checks (CIS Kubernetes Benchmark v1.8+):
#   1. Control Plane Components (API server, controller-manager, scheduler)
#   2. etcd configuration
#   3. Control Plane Configuration (RBAC, audit logging)
#   4. Worker Nodes (kubelet, container runtime)
#   5. Policies (NetworkPolicies, Pod Security, RBAC)
# ============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-bench
spec:
  template:
    metadata:
      labels:
        app: kube-bench
    spec:
      # Run on the control-plane node to check control-plane configs
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
      hostPID: true
      containers:
        - name: kube-bench
          image: aquasec/kube-bench:latest
          imagePullPolicy: IfNotPresent
          command: ["kube-bench", "run", "--targets", "master,node,policies"]
          volumeMounts:
            - name: var-lib-etcd
              mountPath: /var/lib/etcd
              readOnly: true
            - name: var-lib-kubelet
              mountPath: /var/lib/kubelet
              readOnly: true
            - name: etc-systemd
              mountPath: /etc/systemd
              readOnly: true
            - name: lib-systemd
              mountPath: /lib/systemd/
              readOnly: true
            - name: etc-kubernetes
              mountPath: /etc/kubernetes
              readOnly: true
            - name: usr-bin
              mountPath: /usr/local/mount-from-host/bin
              readOnly: true
      restartPolicy: Never
      volumes:
        - name: var-lib-etcd
          hostPath:
            path: /var/lib/etcd
        - name: var-lib-kubelet
          hostPath:
            path: /var/lib/kubelet
        - name: etc-systemd
          hostPath:
            path: /etc/systemd
        - name: lib-systemd
          hostPath:
            path: /lib/systemd
        - name: etc-kubernetes
          hostPath:
            path: /etc/kubernetes
        - name: usr-bin
          hostPath:
            path: /usr/bin
  backoffLimit: 0
